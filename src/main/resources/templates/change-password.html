<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Change Password · USCIS Case Tracker</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments :: topbar}"></header><nav th:replace="~{fragments :: nav}"></nav>
<main class="container narrow">
    <a class="back-link" th:href="@{/profile}">← Profile</a>
    <section class="page-title"><span class="eyebrow">SECURITY</span><h1>Change Password</h1><p>There is no forgot-password email flow in this app.</p></section>
    <div class="flash error" th:if="${error}" th:text="${error}"></div>
    <form class="panel form-stack" th:action="@{/change-password}" method="post" th:object="${form}">
        <label>Current Password<div class="password-field"><input id="cp" type="password" th:field="*{currentPassword}" required><button type="button" data-toggle-password="cp">👁</button></div></label>
        <label>New Password<div class="password-field"><input id="np" type="password" th:field="*{newPassword}" required><button type="button" data-toggle-password="np">👁</button></div><small>At least 8 characters.</small></label>
        <label>Confirm New Password<div class="password-field"><input id="ncp" type="password" th:field="*{confirmPassword}" required><button type="button" data-toggle-password="ncp">👁</button></div></label>
        <button class="btn primary wide" type="submit">Update Password</button>
    </form>
</main><script th:src="@{/js/app.js}"></script>
</body></html>
