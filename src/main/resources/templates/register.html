<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create Account · USCIS Case Tracker</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-shell">
    <section class="auth-hero">
        <div class="seal">U</div><h1>Create your<br>private tracker</h1>
        <p>No Gmail verification. No forgot-password flow. Change your password after login.</p>
    </section>
    <section class="auth-card">
        <a class="back-link" th:href="@{/login}">← Back to login</a>
        <h2>Create Account</h2>
        <div class="flash error" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/register}" method="post" th:object="${form}" class="form-stack">
            <label>Username<input th:field="*{username}" required autocomplete="username" placeholder="eswar"><small th:errors="*{username}"></small></label>
            <label>Email <span class="optional">(optional)</span><input type="email" th:field="*{email}" autocomplete="email" placeholder="you@gmail.com"><small th:errors="*{email}"></small></label>
            <label>Password<div class="password-field"><input id="p1" type="password" th:field="*{password}" required autocomplete="new-password"><button type="button" data-toggle-password="p1">👁</button></div><small>At least 8 characters.</small></label>
            <label>Confirm Password<div class="password-field"><input id="p2" type="password" th:field="*{confirmPassword}" required autocomplete="new-password"><button type="button" data-toggle-password="p2">👁</button></div></label>
            <button class="btn primary wide" type="submit">Create Account</button>
        </form>
    </section>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
