spring.application.name=uscis-case-tracker

server.port=${SERVER_PORT:8082}
server.forward-headers-strategy=framework


# ==========================================================
# PostgreSQL
# ==========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uscis_tracker}
spring.datasource.username=${DB_USERNAME:uscis_app}
spring.datasource.password=${DB_PASSWORD:uscis_app_change_me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true


# ==========================================================
# Session
# ==========================================================

# Set COOKIE_SECURE=true when running behind HTTPS
# on the Beelink server.

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

server.servlet.session.timeout=30m


# ==========================================================
# USCIS
# ==========================================================

# mock = no real USCIS request
# api  = USCIS API

uscis.mode=${USCIS_MODE:mock}

uscis.api.base-url=${USCIS_API_BASE_URL:https://api-int.uscis.gov/case-status}

uscis.api.token-url=${USCIS_TOKEN_URL:https://api-int.uscis.gov/oauth/accesstoken}

uscis.api.client-id=${USCIS_CLIENT_ID:}

uscis.api.client-secret=${USCIS_CLIENT_SECRET:}

uscis.api.demo-id=${USCIS_DEMO_ID:}


# ==========================================================
# Scheduling
# ==========================================================

# Automatically handles EST / EDT daylight saving changes.

app.time-zone=${APP_TIME_ZONE:America/New_York}


# Every hour at minute 0:
# 1:00, 2:00, 3:00, etc.

app.schedule.hourly-cron=${HOURLY_CRON:0 0 * * * *}


# Every day at 5:00 PM Eastern.

app.schedule.daily-email-cron=${DAILY_EMAIL_CRON:0 0 17 * * *}


# ==========================================================
# Gmail SMTP
# ==========================================================

# Local development:
#
# MAIL_ENABLED=false
#
# Production:
#
# MAIL_ENABLED=true
#
# Use a Google App Password.
# Never use the normal Gmail password.

app.mail.enabled=${MAIL_ENABLED:false}

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}


spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:}

spring.mail.password=${MAIL_APP_PASSWORD:}


spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true


# Prevent the scheduler from hanging forever if Gmail
# is unavailable.

spring.mail.properties.mail.smtp.connectiontimeout=10000

spring.mail.properties.mail.smtp.timeout=10000

spring.mail.properties.mail.smtp.writetimeout=10000


# ==========================================================
# Actuator
# ==========================================================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=never


# ==========================================================
# Thymeleaf
# ==========================================================

spring.thymeleaf.cache=false